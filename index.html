<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カメラ起動チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 1カラム。プレビュー → 判定 → 項目リスト の順に、上から読むだけで原因に辿り着く構成 */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#16201f; --muted:#5d6b6a; --line:#d8dfdf;
  --accent:#0f6e6a; --accent-fg:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f3e8; --warn:#8a5a00; --warn-bg:#fbf0d6;
  --ng:#b3261e; --ng-bg:#fbe4e2; --info:#3d5a80; --info-bg:#e6edf6;
  --preview:#0d1413;
  --font-body:"IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1514; --surface:#18201f; --fg:#e4ebea; --muted:#93a3a1; --line:#2b3634;
    --accent:#4fb3ad; --accent-fg:#06211f;
    --ok:#6fd08f; --ok-bg:#16301f; --warn:#f0c060; --warn-bg:#352a10;
    --ng:#ff8a80; --ng-bg:#3a1a18; --info:#9dbbe6; --info-bg:#1a2638;
    --preview:#050807;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 var(--font-body);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
}
.wrap{
  max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px;
  padding-block:20px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1{font-size:1.35rem; line-height:1.3; margin:0; text-wrap:balance; letter-spacing:.01em}
.lead{margin:4px 0 0; color:var(--muted); font-size:.88rem}

.preview{
  position:relative; width:100%; max-width:100%; aspect-ratio:3/4; max-height:62vh;
  background:var(--preview); border-radius:14px; overflow:hidden; margin-inline:auto;
}
.preview video{width:100%; height:100%; object-fit:cover; display:block}
.preview video.mirror{transform:scaleX(-1)}
.preview .ph{
  position:absolute; inset:0; display:grid; place-items:center; text-align:center;
  color:#9fb0ae; font-size:.9rem; padding:24px;
}
.preview .live{
  position:absolute; top:10px; left:10px; font:500 .72rem/1 var(--font-mono); letter-spacing:.08em;
  color:#fff; background:rgba(0,0,0,.55); padding:6px 8px; border-radius:6px;
}
.preview .live::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#34c759; margin-right:6px; vertical-align:1px}

.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{
  appearance:none; border:0; background:transparent; color:var(--fg); font:inherit; font-size:.88rem;
  padding:10px 14px; min-height:44px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); font-weight:500}
.btn{
  appearance:none; border:1px solid transparent; border-radius:10px; font:inherit; font-weight:500;
  padding:10px 18px; min-height:44px; cursor:pointer;
}
.btn-primary{background:var(--accent); color:var(--accent-fg); flex:1 1 160px}
.btn-sub{background:var(--surface); color:var(--fg); border-color:var(--line)}
.btn:disabled{opacity:.45; cursor:default}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.tap{width:100%}

.verdict{
  border-radius:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px;
}
.verdict strong{font-size:1.02rem}
.verdict span{color:var(--muted); font-size:.86rem}
.verdict[data-s="pass"]{background:var(--ok-bg); border-color:transparent}
.verdict[data-s="pass"] strong{color:var(--ok)}
.verdict[data-s="warn"]{background:var(--warn-bg); border-color:transparent}
.verdict[data-s="warn"] strong{color:var(--warn)}
.verdict[data-s="fail"]{background:var(--ng-bg); border-color:transparent}
.verdict[data-s="fail"] strong{color:var(--ng)}

.group-label{font-size:.74rem; letter-spacing:.08em; color:var(--muted); margin:0 0 -8px; font-weight:500}
ol.steps{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:12px}
ol.steps li{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:12px 14px; border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
.chip{
  grid-row:span 2; align-self:start; min-width:52px; text-align:center;
  font:500 .72rem/1 var(--font-mono); letter-spacing:.06em; padding:6px 8px; border-radius:6px;
  background:var(--bg); color:var(--muted);
}
.chip[data-s="pass"]{background:var(--ok-bg); color:var(--ok)}
.chip[data-s="warn"]{background:var(--warn-bg); color:var(--warn)}
.chip[data-s="fail"]{background:var(--ng-bg); color:var(--ng)}
.chip[data-s="info"]{background:var(--info-bg); color:var(--info)}
.chip[data-s="running"]{background:var(--info-bg); color:var(--info)}
.st-title{font-weight:500; min-width:0}
.st-detail{color:var(--muted); font-size:.86rem; min-width:0; overflow-wrap:anywhere}

.foot{display:flex; flex-direction:column; gap:8px}
.ua{font:.74rem/1.5 var(--font-mono); color:var(--muted); overflow-wrap:anywhere; margin:0}
.toast{font-size:.84rem; color:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  .chip[data-s="running"]{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>カメラ起動チェッカー</h1>
    <p class="lead">顔認証の前に、ブラウザでカメラが起動して映像が映るかを確認します。</p>
  </header>

  <div class="preview" id="preview">
    <video id="video" class="mirror" playsinline muted autoplay hidden></video>
    <div class="ph" id="placeholder">「チェック開始」をタップすると<br>ここにカメラ映像が表示されます</div>
    <div class="live" id="live" hidden>LIVE</div>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="使うカメラ">
      <button type="button" id="cam-user" aria-pressed="true">前面</button>
      <button type="button" id="cam-env" aria-pressed="false">背面</button>
    </div>
    <button type="button" class="btn btn-primary" id="start">チェック開始</button>
    <button type="button" class="btn btn-sub" id="stop" disabled>停止</button>
  </div>
  <button type="button" class="btn btn-primary tap" id="tapplay" hidden>タップして映像を再生</button>

  <div class="verdict" id="verdict" data-s="pending">
    <strong id="verdict-title">未チェック</strong>
    <span id="verdict-detail">環境の確認が終わったら「チェック開始」をタップしてください。</span>
  </div>

  <p class="group-label">環境（ページを開いた時点で確認）</p>
  <ol class="steps" id="steps-env"></ol>
  <p class="group-label">カメラ（チェック開始で確認）</p>
  <ol class="steps" id="steps-cam"></ol>

  <div class="foot">
    <button type="button" class="btn btn-sub" id="copy">診断結果をコピー</button>
    <span class="toast" id="toast" role="status" hidden></span>
    <p class="ua" id="ua"></p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const ENV_STEPS = [
    ["secure", "HTTPS接続"],
    ["api", "カメラAPI"],
    ["browser", "ブラウザの種類"],
    ["perm", "カメラ権限"],
  ];
  const CAM_STEPS = [
    ["gum", "カメラの起動"],
    ["track", "映像トラック"],
    ["play", "プレビュー再生"],
    ["frames", "映像フレームの受信"],
    ["light", "映像の明るさ"],
  ];
  const LABEL = { pending: "未実施", running: "確認中", pass: "OK", warn: "注意", fail: "NG", skip: "未実施", info: "情報" };
  const SEVERITY = { fail: 3, warn: 2, pass: 1, info: 0, pending: -1, skip: -1, running: -1 };

  const $ = (id) => document.getElementById(id);
  const video = $("video"), btnStart = $("start"), btnStop = $("stop"), btnTap = $("tapplay");
  const state = {};
  let stream = null, facing = "user", running = false, envOk = false;

  function buildList(el, steps) {
    for (const [id, title] of steps) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="chip"></span><span class="st-title"></span><span class="st-detail"></span>`;
      li.querySelector(".st-title").textContent = title;
      li.id = "st-" + id;
      el.appendChild(li);
      state[id] = { title, status: "pending", detail: "" };
      paint(id);
    }
  }
  function paint(id) {
    const li = $("st-" + id), s = state[id];
    const chip = li.querySelector(".chip");
    chip.dataset.s = s.status;
    chip.textContent = LABEL[s.status];
    li.querySelector(".st-detail").textContent = s.detail;
  }
  function set(id, status, detail) {
    if (!(id in state)) throw new Error("未定義の項目: " + id);
    if (!(status in LABEL)) throw new Error("未定義の状態: " + status);
    state[id].status = status;
    state[id].detail = detail;
    paint(id);
  }
  function skipFrom(id, reason) {
    const ids = CAM_STEPS.map((s) => s[0]);
    for (const k of ids.slice(ids.indexOf(id))) set(k, "skip", reason);
  }

  /* ---------- 環境チェック ---------- */
  function detectBrowser() {
    const ua = navigator.userAgent;
    const inApp = [
      [/\bLine\//i, "LINE"], [/Instagram/, "Instagram"], [/FBAN|FBAV/, "Facebook"],
      [/\bGSA\//, "Googleアプリ"], [/YJApp/, "Yahoo! JAPANアプリ"],
    ];
    for (const [re, name] of inApp) {
      if (re.test(ua)) return ["warn", `${name}のアプリ内ブラウザで開いています。カメラが起動しないことがあるため、Safariで開き直してください`];
    }
    const isIOS = /iPhone|iPad|iPod/.test(ua);
    if (isIOS && /CriOS/.test(ua)) return ["pass", "Chrome（iOS版）。中身はSafariと同じエンジンです"];
    if (isIOS && /FxiOS/.test(ua)) return ["pass", "Firefox（iOS版）。中身はSafariと同じエンジンです"];
    if (isIOS && /EdgiOS/.test(ua)) return ["pass", "Edge（iOS版）。中身はSafariと同じエンジンです"];
    if (isIOS && /Safari\//.test(ua)) return ["pass", "Safari と判定しました"];
    if (isIOS) return ["warn", "Safariの表示ではない可能性があります（アプリ内ブラウザなど）。Safariで開き直すと確実です"];
    return ["info", "iPhone以外のブラウザです。判定対象外のため参考情報として表示しています"];
  }

  async function checkPermission() {
    if (!navigator.permissions || !navigator.permissions.query) {
      set("perm", "info", "このブラウザでは事前に確認できません。カメラ起動時に判明します");
      return;
    }
    let p;
    try {
      p = await navigator.permissions.query({ name: "camera" });
    } catch (e) {
      set("perm", "info", "このブラウザでは事前に確認できません。カメラ起動時に判明します");
      return;
    }
    const show = () => {
      if (p.state === "granted") set("perm", "pass", "このサイトへのカメラ使用は許可済みです");
      else if (p.state === "prompt") set("perm", "pass", "起動時に確認ダイアログが表示されます。「許可」を選んでください");
      else if (p.state === "denied") set("perm", "fail", "拒否されています。アドレスバー左の「ぁあ」→「Webサイトの設定」→「カメラ」を「許可」に変更してください");
      else throw new Error("想定外の権限状態: " + p.state);
    };
    show();
    p.onchange = show;
  }

  function envChecks() {
    const secure = window.isSecureContext === true;
    set("secure", secure ? "pass" : "fail",
      secure ? `${location.protocol.replace(":", "")} で開いています`
             : "HTTPSで開かれていません。カメラはHTTPSのページでしか使えません");

    const api = !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function");
    set("api", api ? "pass" : "fail",
      api ? "カメラAPI（getUserMedia）が使えます"
          : "このブラウザ・この画面ではカメラAPIが使えません。Safariで開き直してください");

    const [bs, bd] = detectBrowser();
    set("browser", bs, bd);
    checkPermission();

    envOk = secure && api;
    if (!envOk) {
      btnStart.disabled = true;
      skipFrom("gum", "環境の項目にNGがあるため実施できません");
    }
    updateVerdict();
  }

  /* ---------- カメラチェック ---------- */
  function gumMessage(e) {
    const map = {
      NotAllowedError: "カメラの使用が拒否されました。許可ダイアログで「許可しない」を選んだか、Safariのサイト設定・「設定 > アプリ > Safari > カメラ」が拒否になっています",
      SecurityError: "セキュリティ上の理由で拒否されました。HTTPSで開いているか、アプリ内ブラウザでないか確認してください",
      NotFoundError: "使えるカメラが見つかりませんでした",
      NotReadableError: "カメラを開けませんでした。ほかのアプリやタブがカメラを使用中の可能性があります。他アプリを終了するか、iPhoneを再起動してください",
      OverconstrainedError: "指定したカメラ（前面/背面）がこの端末で使えません",
      AbortError: "カメラの起動が中断されました",
    };
    return (map[e && e.name] || "カメラを起動できませんでした") + `（${e && e.name ? e.name : "不明なエラー"}）`;
  }

  function waitEvent(target, type, ms) {
    return new Promise((resolve) => {
      const done = (v) => { clearTimeout(t); target.removeEventListener(type, on); resolve(v); };
      const on = () => done(true);
      const t = setTimeout(() => done(false), ms);
      target.addEventListener(type, on, { once: true });
    });
  }

  function countFrames(ms) {
    return new Promise((resolve) => {
      let count = 0;
      const start = performance.now();
      if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
        const tick = () => {
          count++;
          if (performance.now() - start < ms) video.requestVideoFrameCallback(tick);
        };
        video.requestVideoFrameCallback(tick);
        setTimeout(() => resolve({ count, ms }), ms);
      } else {
        let last = video.currentTime;
        const iv = setInterval(() => {
          if (video.currentTime !== last) { count++; last = video.currentTime; }
        }, 30);
        setTimeout(() => { clearInterval(iv); resolve({ count, ms }); }, ms);
      }
    });
  }

  function measureLight() {
    const w = 40, h = 30;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    let sum = 0, sq = 0;
    const n = w * h;
    for (let i = 0; i < d.length; i += 4) {
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      sum += y; sq += y * y;
    }
    const mean = sum / n;
    return { mean, sd: Math.sqrt(Math.max(0, sq / n - mean * mean)) };
  }

  function waitTapPlay() {
    btnTap.hidden = false;
    return new Promise((resolve) => {
      btnTap.onclick = async () => {
        btnTap.onclick = null;
        btnTap.hidden = true;
        try {
          await video.play();
          resolve(true);
        } catch (e) {
          resolve(e);
        }
      };
    });
  }

  async function run() {
    if (!envOk) throw new Error("環境チェックがNGの状態では実行できません");
    stopStream();
    running = true;
    btnStart.disabled = true;
    btnStop.disabled = false;
    for (const [id] of CAM_STEPS) set(id, "pending", "");
    updateVerdict();

    // 1. 起動
    set("gum", "running", "カメラを起動しています。許可ダイアログが出たら「許可」を選んでください");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: facing } }, audio: false });
    } catch (e) {
      set("gum", "fail", gumMessage(e));
      skipFrom("track", "カメラが起動しなかったため実施できません");
      return finish();
    }
    if (!running) { stopStream(); return; }
    const track = stream.getVideoTracks()[0];
    if (!track) {
      set("gum", "fail", "カメラは応答しましたが、映像トラックが返されませんでした");
      skipFrom("track", "映像トラックがないため実施できません");
      return finish();
    }
    set("gum", "pass", `起動しました（${track.label || "名称なし"}）。緑のインジケーターが点灯している状態です`);

    // 2. トラック
    const s = track.getSettings ? track.getSettings() : {};
    const size = s.width && s.height ? `${s.width}×${s.height}` : "サイズ不明";
    if (track.readyState !== "live") {
      set("track", "fail", `トラックが終了しています（${track.readyState}）`);
      skipFrom("play", "映像トラックが動いていないため実施できません");
      return finish();
    }
    if (track.muted) set("track", "warn", `トラックがミュート状態です。OS側で映像が止められています（${size}）`);
    else set("track", "pass", `映像が流れています（${size}${s.frameRate ? " / " + Math.round(s.frameRate) + "fps" : ""}）`);
    track.addEventListener("ended", () => {
      if (running) set("track", "fail", "チェック中に映像トラックが終了しました");
      updateVerdict();
    });

    // 3. 再生
    video.classList.toggle("mirror", facing === "user");
    video.hidden = false;
    $("placeholder").hidden = true;
    video.srcObject = stream;
    set("play", "running", "プレビューを再生しています");
    let played = false;
    try {
      await video.play();
      played = true;
      set("play", "pass", "自動再生できました");
    } catch (e) {
      if (e && e.name === "NotAllowedError") {
        set("play", "warn", "自動再生がブロックされました。下の「タップして映像を再生」を押してください");
        updateVerdict();
        const r = await waitTapPlay();
        if (!running) return;
        if (r === true) {
          played = true;
          set("play", "warn", "タップすれば再生できますが、自動再生はブロックされています。低電力モードがオンの可能性があります。顔認証サイトで画面が切り替わらない原因になります");
        } else {
          set("play", "fail", `タップしても再生できませんでした（${r && r.name ? r.name : "不明なエラー"}）`);
        }
      } else {
        set("play", "fail", `プレビューを再生できませんでした（${e && e.name ? e.name : "不明なエラー"}）`);
      }
    }
    if (!played) {
      skipFrom("frames", "プレビューが再生されないため実施できません");
      return finish();
    }
    $("live").hidden = false;

    // 4. フレーム
    set("frames", "running", "映像フレームを確認しています（約2秒）");
    if (video.videoWidth === 0) await waitEvent(video, "loadedmetadata", 5000);
    const fr = await countFrames(2000);
    if (!running) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (fr.count === 0 || vw === 0) {
      set("frames", "fail", "カメラは起動していますが、映像フレームが1枚も届いていません。画面に映らない状態です");
      skipFrom("light", "フレームが届かないため実施できません");
      return finish();
    }
    const fps = Math.round(fr.count / (fr.ms / 1000));
    if (fps < 5) set("frames", "warn", `フレームの間隔が極端に遅いです（約${fps}fps / ${vw}×${vh}）`);
    else set("frames", "pass", `映像が届いています（約${fps}fps / ${vw}×${vh}）`);

    // 5. 明るさ
    let lm;
    try {
      lm = measureLight();
    } catch (e) {
      set("light", "fail", `映像を解析できませんでした（${e && e.name ? e.name : "不明なエラー"}）`);
      return finish();
    }
    const mean = Math.round(lm.mean);
    if (lm.mean < 6 && lm.sd < 3) set("light", "fail", `映像が真っ黒です（平均輝度 ${mean}/255）。レンズが覆われていないか確認してください`);
    else if (lm.mean < 40) set("light", "warn", `映像が暗いです（平均輝度 ${mean}/255）。顔認証が失敗しやすいため明るい場所で行ってください`);
    else if (lm.sd < 2) set("light", "warn", `映像がほぼ単色です（平均輝度 ${mean}/255）。カメラの前に何かありませんか`);
    else set("light", "pass", `正常に映っています（平均輝度 ${mean}/255）`);
    finish();
  }

  function finish() {
    btnStart.disabled = !envOk;
    btnStart.textContent = "もう一度チェック";
    updateVerdict();
  }

  function stopStream() {
    if (stream) for (const t of stream.getTracks()) t.stop();
    stream = null;
    video.srcObject = null;
    video.hidden = true;
    $("placeholder").hidden = false;
    $("live").hidden = true;
    btnTap.hidden = true;
    btnTap.onclick = null;
  }

  function stopAll() {
    running = false;
    stopStream();
    btnStop.disabled = true;
    btnStart.disabled = !envOk;
    for (const [id] of CAM_STEPS) {
      if (state[id].status === "running" || state[id].status === "pending") set(id, "skip", "停止したため未実施です");
    }
    updateVerdict();
  }

  /* ---------- 判定 ---------- */
  function updateVerdict() {
    const all = [...ENV_STEPS, ...CAM_STEPS].map(([id]) => state[id]);
    const worst = all.reduce((a, b) => (SEVERITY[b.status] > SEVERITY[a.status] ? b : a));
    const camDone = CAM_STEPS.every(([id]) => ["pass", "warn", "fail", "skip"].includes(state[id].status));
    const camAllPass = CAM_STEPS.every(([id]) => state[id].status === "pass");
    const v = $("verdict");
    let s, title, detail;
    if (worst.status === "fail") {
      s = "fail"; title = "カメラを正常に使えません"; detail = `${worst.title}：${worst.detail}`;
    } else if (worst.status === "warn") {
      s = "warn"; title = "注意が必要な項目があります"; detail = `${worst.title}：${worst.detail}`;
    } else if (camDone && camAllPass) {
      s = "pass"; title = "カメラは正常に起動し、映像も映っています";
      detail = "このブラウザでは顔認証のカメラが動く状態です。それでも失敗する場合はサービス側の問題の可能性があります";
    } else {
      s = "pending"; title = "未チェック"; detail = "「チェック開始」をタップしてください。";
    }
    v.dataset.s = s;
    $("verdict-title").textContent = title;
    $("verdict-detail").textContent = detail;
  }

  /* ---------- 診断結果のコピー ---------- */
  function report() {
    const lines = [
      "【カメラ起動チェック結果】",
      "日時: " + new Date().toLocaleString("ja-JP"),
      "使用カメラ: " + (facing === "user" ? "前面" : "背面"),
      "判定: " + $("verdict-title").textContent,
      "",
    ];
    for (const [id] of [...ENV_STEPS, ...CAM_STEPS]) {
      const s = state[id];
      lines.push(`[${LABEL[s.status]}] ${s.title}${s.detail ? "：" + s.detail : ""}`);
    }
    lines.push("", "UA: " + navigator.userAgent);
    return lines.join("\n");
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.hidden = true; }, 2500);
  }
  $("copy").addEventListener("click", () => {
    const text = report();
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand && document.execCommand("copy");
      document.body.removeChild(ta);
      toast(ok ? "コピーしました" : "コピーできませんでした");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast("コピーしました"), fallback);
    } else {
      fallback();
    }
  });

  /* ---------- 操作 ---------- */
  function setFacing(f) {
    facing = f;
    $("cam-user").setAttribute("aria-pressed", String(f === "user"));
    $("cam-env").setAttribute("aria-pressed", String(f === "environment"));
    if (running && stream) run();
  }
  $("cam-user").addEventListener("click", () => setFacing("user"));
  $("cam-env").addEventListener("click", () => setFacing("environment"));
  btnStart.addEventListener("click", () => { run(); });
  btnStop.addEventListener("click", stopAll);
  window.addEventListener("pagehide", stopStream);

  buildList($("steps-env"), ENV_STEPS);
  buildList($("steps-cam"), CAM_STEPS);
  $("ua").textContent = navigator.userAgent;
  envChecks();
})();
</script>
</body>
</html>
